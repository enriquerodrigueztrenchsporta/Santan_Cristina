# Publica una copia de previsualización de la web en GitHub Pages:
#   https://enriquerodrigueztrenchsporta.github.io/Santan_Cristina/
# Se ejecuta con cada push a main (o a mano desde la pestaña Actions).
# La copia lleva "noindex" para que Google no la confunda con la web oficial.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          PUBLIC_PREVIEW: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
